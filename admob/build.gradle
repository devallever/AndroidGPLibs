plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    compileSdk 36
    namespace 'com.allever.android.lib.admob'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
        dataBinding = false
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
        }
    }
}

dependencies {
    api "androidx.constraintlayout:constraintlayout:2.1.4"
    //
    api "com.google.android.gms:play-services-ads:25.5.0"
    api("com.google.ads.mediation:ironsource:9.7.0.0")
    api "com.google.ads.mediation:unity:4.12.1.0"
    api "com.github.bumptech.glide:glide:4.15.1"
    implementation 'com.google.android.material:material:1.6.0'
    api "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    api "com.google.android.ump:user-messaging-platform:4.0.0"
}

